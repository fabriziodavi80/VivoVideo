name: Compila APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compila
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest -Proborazzi.test.record=true assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Pubblica la release
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VER="v0.3.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk VivoVideo.apk
          NEWS=$(awk '/^## Novità/{f=1;next} /^## /{f=0} f' app/src/main/assets/guida.md)
          NOTES="${COMMIT_MSG:-Compilazione manuale}

          Novità:
          ${NEWS}

          Guida completa: nell'app (pulsante ?) o https://github.com/${GITHUB_REPOSITORY}/blob/main/app/src/main/assets/guida.md"
          gh release create "$VER" VivoVideo.apk --title "VivoVideo $VER" --notes "$NOTES" --latest

      # Salva l'esito e il registro di compilazione nel ramo build-logs,
      # così Claude può leggerli e correggere gli errori.
      - name: Salva il registro
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          mkdir -p /tmp/logs
          cp build.log /tmp/logs/build.log 2>/dev/null || echo "nessun registro" > /tmp/logs/build.log
          mkdir -p /tmp/logs/screens /tmp/logs/tests
          cp app/build/test-results/testDebugUnitTest/*.xml /tmp/logs/tests/ 2>/dev/null || true
          find app/build -path "*roborazzi*" -name "*.png" -exec cp {} /tmp/logs/screens/ \; 2>/dev/null || true
          grep -E "^e: |error:|FAILURE|What went wrong|FAILED|AssertionError|Exception" -A4 /tmp/logs/build.log > /tmp/logs/errors.txt || true
          echo "run=${GITHUB_RUN_NUMBER} sha=${GITHUB_SHA} outcome=${OUTCOME}" > /tmp/logs/status.txt
          cd /tmp/logs
          git init -q
          git checkout -q -b build-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -qm "Build ${GITHUB_RUN_NUMBER}: ${OUTCOME}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build-logs

  # Prove vere su un emulatore Android: esportazioni complete, anteprima che scorre, dissolvenze preparate.
  # Gira in parallelo alla compilazione (non ritarda la release); l'esito va nel ramo emulator-logs.
  emulatore:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compila le prove
        run: gradle assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Prove sull'emulatore
        id: device
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            adb logcat -c || true
            (adb logcat -v time > logcat.txt &) ; gradle connectedDebugAndroidTest --no-daemon > device.log 2>&1

      - name: Salva l'esito
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.device.outcome }}
        run: |
          mkdir -p /tmp/elogs/tests
          cp device.log /tmp/elogs/ 2>/dev/null || echo "nessun registro" > /tmp/elogs/device.log
          find app/build -path "*androidTest-results*" -name "*.xml" -exec cp {} /tmp/elogs/tests/ \; 2>/dev/null || true
          # Registro di ogni prova (raccolto da Gradle): solo errori e avvisi, per vedere la causa vera di un fallimento.
          find app/build -path "*androidTest-results*" -name "logcat-*.txt" 2>/dev/null | while read -r f; do
            grep -E " [EWF] |[EWF]/|Exception|Caused by|at androidx\.media3" "$f" | tail -300 > "/tmp/elogs/tests/$(basename "$f")" || true
            [ -s "/tmp/elogs/tests/$(basename "$f")" ] || rm -f "/tmp/elogs/tests/$(basename "$f")"
          done
          grep -E "VivoVideo|AndroidRuntime|FATAL|Media3|ExoPlayer|Transformer|TestRunner" logcat.txt | tail -400 > /tmp/elogs/logcat.txt 2>/dev/null || true
          # Errori di tutto il giro, dall'inizio (il registro sopra tiene solo la fine).
          grep -E "TestRunner|AutoScene|CodecException|Caused by|ExportException| E/(Transformer|ExoPlayer|MediaCodec|CCodec|DefaultCodec)" logcat.txt | head -600 > /tmp/elogs/logcat-errori.txt 2>/dev/null || true
          grep -E "FAILED|AssertionError|Exception|tests completed|BUILD" -A25 /tmp/elogs/device.log > /tmp/elogs/errors.txt || true
          echo "run=${GITHUB_RUN_NUMBER} sha=${GITHUB_SHA} outcome=${OUTCOME}" > /tmp/elogs/status.txt
          cd /tmp/elogs
          git init -q
          git checkout -q -b emulator-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -qm "Emulatore ${GITHUB_RUN_NUMBER}: ${OUTCOME}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" emulator-logs
