name: Compila APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compila
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Pubblica la release
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VER="v0.1.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk VivoVideo.apk
          NOTES="${COMMIT_MSG:-Compilazione manuale}"
          gh release create "$VER" VivoVideo.apk --title "VivoVideo $VER" --notes "$NOTES" --latest

      # Salva l'esito e il registro di compilazione nel ramo build-logs,
      # così Claude può leggerli e correggere gli errori.
      - name: Salva il registro
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          mkdir -p /tmp/logs
          cp build.log /tmp/logs/build.log 2>/dev/null || echo "nessun registro" > /tmp/logs/build.log
          grep -E "^e: |error:|FAILURE|What went wrong|FAILED|AssertionError|Exception" -A4 /tmp/logs/build.log > /tmp/logs/errors.txt || true
          echo "run=${GITHUB_RUN_NUMBER} sha=${GITHUB_SHA} outcome=${OUTCOME}" > /tmp/logs/status.txt
          cd /tmp/logs
          git init -q
          git checkout -q -b build-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -qm "Build ${GITHUB_RUN_NUMBER}: ${OUTCOME}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build-logs
